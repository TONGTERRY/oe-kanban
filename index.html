<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OE 竞品看板</title>
<style>
  :root{--navy:#1A365D;--teal:#2B6B7A;--amber:#C05621;--line:#E3E7E8;--mut:#6B7280}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#F7F8F8;color:#1F2933}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:40px 44px;
        width:min(92vw,520px);text-align:center;box-shadow:0 8px 30px rgba(26,54,93,.06)}
  h1{font-size:20px;margin:0 0 6px;color:var(--navy);letter-spacing:.3px}
  .sub{font-size:13px;color:var(--mut);margin-bottom:22px}
  .spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid #E3E9EC;border-top-color:var(--teal);
        border-radius:50%;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .tip{font-size:12.5px;color:var(--mut);line-height:1.8}
  a{color:var(--teal);word-break:break-all}
  .btn{display:inline-block;margin-top:16px;padding:9px 22px;border-radius:10px;background:var(--navy);
       color:#fff;text-decoration:none;font-size:13.5px}
  .err{color:var(--amber);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="sp"></div>
  <h1>OE 竞品看板</h1>
  <div class="sub">正在跳转到当前服务地址…</div>
  <div class="tip">如果没有自动跳转，请点下面的按钮；<br>地址偶尔会更新（电脑重启后），本页会自动跟上。</div>
  <a class="btn" id="go" href="#" style="display:none">打开看板</a>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  var bust = '?t=' + Date.now();
  fetch('url.txt' + bust, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){
      var u = (t || '').trim().split('\n')[0].trim();
      if(!/^https?:\/\//.test(u)) throw new Error('地址文件内容异常');
      document.getElementById('go').href = u;
      location.replace(u);
      setTimeout(function(){
        document.getElementById('sp').style.display = 'none';
        document.getElementById('go').style.display = 'inline-block';
        document.querySelector('.sub').textContent = '当前地址：' + u;
      }, 2500);
    })
    .catch(function(e){
      document.getElementById('sp').style.display = 'none';
      document.getElementById('err').textContent = '暂时读不到最新地址（' + e.message + '），请稍后刷新，或联系童惊韬。';
    });
})();
</script>
</body>
</html>
